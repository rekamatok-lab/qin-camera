name: Build APK
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: unzip -q qin-camera.zip
      - run: cd qin-camera && bash setup.sh
      - run: cd qin-camera/android && chmod +x gradlew && ./gradlew assembleDebug
      - run: cp qin-camera/android/app/build/outputs/apk/debug/app-debug.apk QinCamera.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: QinCamera.apk
